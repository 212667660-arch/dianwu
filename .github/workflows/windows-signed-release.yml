name: Windows signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    environment: windows-signing
    timeout-minutes: 120
    steps:
      - name: Check out immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/a3-front/package-lock.json

      - name: Verify source identity and version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = git rev-parse HEAD
          if ($commit -cne $env:GITHUB_SHA) { throw 'Checked out commit does not match GITHUB_SHA.' }
          $version = (Get-Content -Raw front/a3-front/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_EVENT_NAME -ceq 'push') {
            if ($env:GITHUB_REF -notlike 'refs/tags/v*') { throw 'Push signed releases require a version tag.' }
            if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Release tag does not match package version.' }
          }
          elseif ($env:GITHUB_EVENT_NAME -ceq 'workflow_dispatch') {
            if ($env:GITHUB_REF -cne 'refs/heads/main') { throw 'Manual signed releases are restricted to main.' }
          }
          else {
            throw 'Unsupported signed release event.'
          }
          Write-Host "commit=$commit"
          Write-Host "version=$version"
          Write-Host "actor=$env:GITHUB_ACTOR"
          Write-Host "ref=$env:GITHUB_REF"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt pyinstaller

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Test backend
        run: python -m pytest -q backend

      - name: Install frontend dependencies
        working-directory: front/a3-front
        run: npm ci

      - name: Test frontend and release tooling
        working-directory: front/a3-front
        run: npm test

      - name: Build desktop frontend
        working-directory: front/a3-front
        run: npm run build:desktop

      - name: Build packaged backend
        shell: pwsh
        run: ./backend/build_api.ps1

      - name: Verify packaged backend
        shell: pwsh
        run: ./backend/verify_api_package.ps1

      - name: Stage packaged backend
        shell: pwsh
        run: ./scripts/release/prepare-desktop-backend.ps1

      - name: Scan tracked release sources
        shell: pwsh
        run: ./scripts/release/test-release-secrets.ps1

      - name: Build signed Windows installer
        working-directory: front/a3-front
        env:
          A3_SIGNED_RELEASE: '1'
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          A3_EXPECTED_PUBLISHER: ${{ vars.A3_EXPECTED_PUBLISHER }}
        run: npm run desktop:dist:signed

      - name: Verify signed Windows release
        shell: pwsh
        env:
          A3_EXPECTED_PUBLISHER: ${{ vars.A3_EXPECTED_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw front/a3-front/package.json | ConvertFrom-Json).version
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'front/a3-front/release'
          $manifestPath = Join-Path $releaseDir 'a3-windows-release-manifest.json'
          ./scripts/release/verify-windows-signatures.ps1 -InstallAndVerify -Version $version -SourceCommit $env:GITHUB_SHA -ExpectedPublisher $env:A3_EXPECTED_PUBLISHER -ReleaseDir $releaseDir -ManifestPath $manifestPath

      - name: Upload verified manual release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: a3-windows-signed-${{ github.sha }}
          path: |
            front/a3-front/release/*.exe
            front/a3-front/release/a3-windows-release-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish verified tag release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --verify-tag --title $tag --generate-notes }
          $installer = @(Get-ChildItem -LiteralPath front/a3-front/release -Filter '*.exe' -File)
          if ($installer.Count -ne 1) { throw 'Expected exactly one verified installer.' }
          gh release upload $tag $installer[0].FullName front/a3-front/release/a3-windows-release-manifest.json --clobber
